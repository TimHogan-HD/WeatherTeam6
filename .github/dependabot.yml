# Weekly version updates. Each PR goes through the required `ci` and `review`
# checks like any other (claude-review.yml allows dependabot[bot]), and npm
# PRs other than drizzle's merge themselves once both pass
# (dependabot-automerge.yml).
#
# Security updates are on in the repository settings and arrive separately,
# grouped by GitHub, whenever an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    # One lockfile at the root covers every workspace, so "/" updates
    # apps/* and packages/* together. That also keeps the root `vite` pin
    # (CLAUDE.md, Known Gotchas) in step with apps/miniapp's.
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release has to be a week old before it is proposed: most hijacked
    # npm releases are pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # drizzle-orm and drizzle-kit move together, and a 0.x minor can change
      # generated migrations, so they get their own PR and are never batched.
      drizzle:
        patterns: ["drizzle-*"]
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor:
        dependency-type: production
        update-types: [minor, patch]
      # Major versions are not grouped: each arrives as its own PR.
    ignore:
      # Drizzle 1.0 is a migration project, not a bump.
      - dependency-name: "drizzle-*"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node release, not the newest typings: types
      # for a newer major describe APIs the runtime (Node 24, `engines` and
      # ci.yml) does not have. Raise it by hand with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # claude-review.yml uses checkout and upload-artifact as well as
    # claude-code-action, so nearly every actions bump edits it, and a PR that
    # edits that file passes `review` unreviewed (CLAUDE.md, Rules). One
    # grouped PR a week, read by a person and never auto-merged.
    groups:
      actions:
        patterns: ["*"]
