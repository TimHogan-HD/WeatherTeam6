name: Claude Review

# An independent reviewer, running outside the session that wrote the code.
#
# Why this exists: `/code-review` run locally is a subagent of the same session
# that produced the diff. It shares the context, and it has repeatedly shared
# the blind spot — on 2026-08-26 a defect went to `main` and was found only
# because the user asked for a second audit by hand. This runs on GitHub, on
# the pushed diff, with no memory of why the code was written that way.
#
# Findings are advisory: they post as inline comments and never block the merge.
# CI is what blocks.
#
# REQUIRES the CLAUDE_CODE_OAUTH_TOKEN repository secret. Without it every run
# skips cleanly with a note rather than failing the PR.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped; the reviewer costs tokens and a draft is not ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check the review credential is present
        id: cred
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude Review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token' and add it as a repository secret to enable independent PR review."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cred.outputs.present == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.cred.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
