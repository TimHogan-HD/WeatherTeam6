name: Claude Review

# An independent reviewer, running outside the session that wrote the code.
#
# Why this exists: `/code-review` run locally is a subagent of the same session
# that produced the diff. It shares the context, and it has repeatedly shared
# the blind spot — on 2026-08-26 a defect went to `main` and was found only
# because the user asked for a second audit by hand. This runs on GitHub, on
# the pushed diff, with no memory of why the code was written that way.
#
# Findings come in two kinds (owner, 2026-11-04). A blocking finding is a
# defect with an input that makes it go wrong; it fails the job, so the PR
# cannot merge until it is fixed or the reviewer accepts a reply to it. An
# advisory finding is posted and does not fail anything. The job also fails
# when no summary names the head commit, or the summary has no "Blocking:" line.
#
# `review` is a required status check on `main` (2026-10-21) and auto-merge
# is how a PR lands, so a green job must mean a review happened and found
# nothing blocking. Drafts are reviewed too: until 2026-11-04 they were
# skipped, GitHub counts a skipped job as a pass, and a PR opened as a draft
# and marked ready paid for a second full review of the same commit. A commit
# that already has a clean summary is not reviewed again (marked ready,
# reopened, re-run). The one way to finish green unreviewed is a PR that edits
# this file (the action refuses to run on it), so keep such a PR to the
# workflow alone. A missing CLAUDE_CODE_OAUTH_TOKEN fails the job.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # Until 2026-10-21 a missing secret passed with a notice. With `review`
      # required, that would be a green check on a PR nobody reviewed.
      - name: Check the review credential is present
        id: cred
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=No review credential::CLAUDE_CODE_OAUTH_TOKEN is not set, so this PR cannot be reviewed. Run 'claude setup-token' and add it as a repository secret."
            exit 1
          fi

      # A commit with a clean summary was already reviewed: a draft marked
      # ready, a reopen, or a re-run of a run that passed. Reviewing it again
      # costs a full Opus pass and finds what the first one found. A summary
      # with blocking findings is reviewed again, so a re-run after replying to
      # a finding gets a fresh look.
      - name: Check whether this commit already has a clean review
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select((.user.login | test("^claude(\\[bot\\])?$"; "i")) and (.body | contains("## Claude review")) and (.body | contains(env.HEAD_SHA))) | .body | @json' \
            | tail -n 1)
          if [ -n "$latest" ] && echo "$latest" | jq -r . | grep -qE '^Blocking:[[:space:]]*0[[:space:]]*$'; then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            echo "${HEAD_SHA} already has a clean review; not reviewing it again."
          else
            echo "reviewed=false" >> "$GITHUB_OUTPUT"
          fi

      # fetch-depth: 0, not 1. The reviewer diffs the PR head against its merge
      # base; a depth-1 checkout has neither the base commit nor the history to
      # find it, so `git diff` returns nothing and the review silently covers an
      # empty diff. Same failure this repo already hit in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Full review on the first pass (Opus); after that, a push is reviewed only
      # from the last commit a summary covered (Sonnet, fewer turns). The required
      # `review` check runs on every head commit, so before 2026-10-07 every push paid
      # for a full review. Decision and fallbacks: .claude/hooks/lib/reviewScope.mjs.
      - name: Choose the review scope
        id: scope
        if: steps.existing.outputs.reviewed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: node .github/scripts/review-scope.mjs

      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        if: steps.existing.outputs.reviewed != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # The action refuses PRs opened by a bot unless it is named here, and
          # `review` is required, so without this every Dependabot PR is red.
          # Dependabot runs read the Dependabot copy of CLAUDE_CODE_OAUTH_TOKEN.
          allowed_bots: "dependabot[bot]"
          # The prompt is this repo's own, not the `code-review` plugin's command.
          # Under the plugin, 60 PRs in a row (#196-#255) got "No issues found"
          # or no comment at all, from runs of 3-4 turns and 4-12 seconds — too
          # short to have read a diff. A review that cannot have looked must not
          # read as a pass, so the summary has to say what was read.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The PR head is checked out. Base branch: ${{ github.event.pull_request.base.ref }}.

            Scope: ${{ steps.scope.outputs.mode }}.

            1. If the scope is full: run `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
               and read the whole diff.
               If the scope is incremental: commit ${{ steps.scope.outputs.since }} was already reviewed in
               full. Run `git diff ${{ steps.scope.outputs.since }} HEAD -- $(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)`
               and review only that. Do not re-report findings already posted on this PR.
            2. `.claude/rules/defect-patterns.md`, `.claude/rules/architecture.md` and `CLAUDE.md` load
               automatically; read them only if they are not already in your context. Apply the parts
               that govern the files changed.
            3. For each hunk, ask what it does when an input is null, 0, absent, or a fetch fails, and
               whether it breaks a written rule. Read surrounding code and callers with Read/Grep before
               claiming anything; grep for where a field is read, not only where it is set.
            4. Report only real defects you can point to a line for. For each, post an inline comment
               with mcp__github_inline_comment__create_inline_comment, starting with "Blocking:" or
               "Advisory:", then what goes wrong, on what input. No style nits, no praise.
               Blocking: you can name an input or state on which the code at HEAD does the wrong
               thing (one of the defect classes in defect-patterns.md, a broken written rule, a crash,
               a security hole, data loss, a migration that cannot apply). Advisory: everything you
               could not confirm, missing tests, and risks without a failing input. Blocking findings
               fail this check and stop the PR from merging, so do not mark a finding blocking unless
               you would bet on it; and do not mark one advisory to be polite.
            5. Earlier blocking findings. Read earlier "## Claude review" summaries with
               `gh pr view ${{ github.event.pull_request.number }} --comments`, and your inline comments and
               the replies to them with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`.
               For each earlier blocking finding, check HEAD:
               fixed, still present, or answered by a reply that shows it is not a defect. Count every
               one still present and not answered as blocking again, even in an incremental review, and
               list it in the summary. Do not post a second inline comment for it.
            6. Finish with exactly one PR comment via `gh pr comment ${{ github.event.pull_request.number }} --body "..."`:
               a "## Claude review" heading, a line "Commit: ${{ github.event.pull_request.head.sha }}"
               (the full SHA, exactly), a line "Scope: ${{ steps.scope.outputs.mode }}", a line
               "Blocking: <n>" (n = blocking findings still open at HEAD, new and earlier; the line is
               exactly that, a digit count and nothing after it), a line "Advisory: <n>", one line per
               open blocking finding saying what and where, and a line "Read: <the files you opened>".
               If you found nothing, write "Blocking: 0" and still list what you read. Start the body with
               "## Claude review" and put no other line in it that begins with `#` — no further
               headings, no handoff block. Claude Code refuses a Bash command in which a newline is
               followed by `#`, and on PR #286 that left a finished review unposted. This check looks
               for the heading, that SHA and the "Blocking:" line; without all three, or with a count
               above 0, the PR cannot merge.
          # --allowedTools REPLACES the default allowlist, it does not extend it.
          # Listing only the comment tool left the reviewer able to post findings
          # but unable to read a single file: on PR #56 it burned 32 permission
          # denials over 8 minutes and $4.23 before erroring out. It had "passed"
          # twice before that only because those diffs were small enough to review
          # from the prompt text alone — a green check that never exercised the
          # path it claims to cover.
          #
          # On PR #72 it did it again: 28 denials over 16 turns, $1.55, no review
          # posted. The list above covers the tools the reviewer *reads* with but
          # not the ones the `/code-review` skill *works* with — it plans with
          # TodoWrite and fans verification out to subagents, and a denied Task
          # is denied once per agent it tried to spawn, which is why the count
          # arrives in batches rather than singly.
          #
          # Read-only tools only. The reviewer must never be able to mutate the
          # repo: no Edit/Write, and no `gh pr merge`/`git push` via Bash. Task
          # is safe to add because a subagent inherits this same allowlist —
          # it can fan out, but only over read-only tools.
          # `gh pr comment` is the one write: the summary line above. `gh pr view`,
          # `gh pr diff` and the `gh api` path for this PR's inline comments read.
          claude_args: >-
            --model ${{ steps.scope.outputs.model }}
            --max-turns ${{ steps.scope.outputs.max_turns }}
            --allowedTools
            "Read,Grep,Glob,Task,TodoWrite,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),mcp__github_inline_comment__create_inline_comment"

      # A run that ends without the summary is a failed run, not a green one, and
      # so is a summary with blocking findings open: this is what lets `review`
      # be the required status check that auto-merge waits on.
      - name: Confirm a clean summary names the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The action skips a PR that changes this file (it must match the
          # default branch), so no summary can exist; wait:pr and the Stop hook
          # exempt such a PR for the same reason. The check still goes green, so say
          # loudly what went unreviewed: keep such a PR to the workflow alone.
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if echo "$changed" | grep -qx '.github/workflows/claude-review.yml'; then
            echo "::warning title=Not reviewed::This PR edits claude-review.yml, so the reviewer cannot run on it. Nothing in it was reviewed."
            {
              echo "## Not reviewed"
              echo "This PR edits \`claude-review.yml\`, so the reviewer cannot run. These files passed unreviewed:"
              echo "$changed" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The newest summary naming this commit is the verdict.
          latest=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select((.user.login | test("^claude(\\[bot\\])?$"; "i")) and (.body | contains("## Claude review")) and (.body | contains(env.HEAD_SHA))) | .body | @json' \
            | tail -n 1)
          if [ -z "$latest" ]; then
            echo "::error title=No review summary::The reviewer posted no '## Claude review' comment naming ${HEAD_SHA}."
            exit 1
          fi
          body=$(echo "$latest" | jq -r .)
          blocking=$(echo "$body" | sed -nE 's/^Blocking:[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' | head -n 1)
          if [ -z "$blocking" ]; then
            echo "::error title=No verdict::The review summary for ${HEAD_SHA} has no 'Blocking: <n>' line, so it cannot pass."
            exit 1
          fi
          if [ "$blocking" -gt 0 ]; then
            echo "::error title=Blocking findings::The review of ${HEAD_SHA} has ${blocking} blocking finding(s) open. Fix them and push, or reply to the inline comment showing why it is not a defect and re-run this job."
            {
              echo "## Blocking findings: ${blocking}"
              echo "$body" | sed 's/^#/\\#/'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The run log records `permission_denials_count` and nothing about *which*
      # tool was denied, so the two failures above were both diagnosed by
      # guessing. The execution output has the tool stream in it; keeping it on a
      # failed run means the next one is read rather than inferred.
      - name: Keep the execution output when the reviewer fails
        if: failure() && steps.cred.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-review-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14
