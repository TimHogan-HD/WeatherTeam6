name: CI

# A branch is checked through its PR, `main` on every push. Pushing on `**` as
# well ran every PR commit twice (the push run and the pull_request run).
on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch cancels the run still going for the first.
# Read-only token. Nothing in this workflow writes to the repository, and the
# default token scope depends on a repo setting that can change underneath it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Vercel Remote Cache for turbo: a build, typecheck or lint whose inputs a
    # previous run already hashed is replayed instead of re-run. Tests are
    # never cached (turbo.json). A Dependabot run cannot read Actions
    # secrets, so it gets an empty token and turbo builds without the cache.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    # The database checks' throwaway Postgres, reached the way `ui.yml` reaches
    # it: through Neon's own WebSocket proxy, so the driver is production's.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          ALLOW_ADDR_REGEX: "^postgres:5432$"
          LOG_CONN_INFO: "false"
        ports:
          - 5488:80
    steps:
      - uses: actions/checkout@v7
        with:
          # check:hooks runs most of its scenarios against scratch repos in the
          # temp dir, which do not need this. But a handful run against the
          # checkout itself, and gitState.defaultBranch() reads origin/HEAD and
          # falls back to origin/main. A depth-1 checkout has neither, so those
          # readers return null and the guards they feed quietly stand down —
          # passing without testing anything. Cheap insurance against a green
          # check that measured nothing.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # makeRepo() sets user.email/user.name on each scratch repo itself, so
      # this is belt and braces — but a scenario that forgets to would fail on a
      # runner with no global identity and pass locally, which is the exact
      # environment-dependent failure this file exists to stop.
      - name: Configure git identity for hook scenarios
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Every root-level `check:*` script, enumerated from package.json rather
      # than listed here.
      #
      # This is the whole reason this job exists. `check:hooks` was a real gate
      # that no machine ran: CI listed its steps by hand, nobody added it, and
      # on 2026-08-26 CI reported success on commit bfe1e83 while check:hooks
      # was failing 46 of its 49 cases on main.
      #
      # A hand-maintained list of checks drifts exactly like a hand-maintained
      # list of issues did. Deriving it means a new root `check:*` script is in
      # CI the moment it exists.
      #
      # Workspace-level `check:*` scripts are not root checks: a root-level check
      # is hermetic. The ones that need only Postgres run in the next step.
      - name: Repo checks (all root check:* scripts)
        run: |
          set -euo pipefail
          mapfile -t checks < <(node -e "
            const s = require('./package.json').scripts ?? {};
            for (const k of Object.keys(s)) if (k.startsWith('check:')) console.log(k);
          ")
          if [ ${#checks[@]} -eq 0 ]; then
            echo "No root check:* scripts found — that is almost certainly wrong."
            exit 1
          fi
          for c in "${checks[@]}"; do
            echo "::group::npm run $c"
            npm run "$c"
            echo "::endgroup::"
          done

      # The acceptance scripts that are the only tests of the auth gate, the
      # cross-account 404s and the delete cascades (Vitest never reaches
      # Postgres). Before 2026-11-03 they ran only when a session remembered.
      # Each needs nothing but the local app and the database; the ones that
      # call a weather upstream (check:add-location, check:conditions, ...) are
      # left out so this job never spends the shared Open-Meteo allowance.
      # Each script's own command comes from apps/api/package.json, run with
      # the preload that points the driver at the proxy.
      - name: Database checks (throwaway Postgres)
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:ci-only@postgres:5432/postgres
          CHECK_UI_WS_PROXY: localhost:5488
        run: |
          set -euo pipefail
          npm run migrate:local
          run_with_proxy() {
            local file
            file=$(node -p "require('./package.json').scripts['$1'].replace(/^tsx /, '')")
            npx tsx --import ./src/scripts/localPostgresPreload.ts $file
          }
          run_with_proxy db:seed
          for c in auth invites edit-location delete-trip edit-trip feedback logbook preferences; do
            echo "::group::check:$c"
            run_with_proxy "check:$c"
            echo "::endgroup::"
          done
