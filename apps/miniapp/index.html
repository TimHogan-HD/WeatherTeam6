<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes Telegram's safe-area insets meaningful. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WeatherTeam6</title>

    <!--
      Loaded synchronously and before the app module on purpose: window.Telegram
      has to exist by the time React mounts, or the first render misses the
      chrome and BackButton wiring. The ?63 query is Telegram's own version pin
      from https://core.telegram.org/bots/webapps.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <!--
      Barlow Condensed (display) and Barlow (body) — the two families named by
      the design tokens. Weights match what tokens.ts actually uses.
      src/theme/fonts.ts carries a real fallback stack for when this fails.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
