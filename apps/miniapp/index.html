<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) meaningful. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WeatherTeam6</title>

    <!--
      The manifest link and <meta name="theme-color"> are injected by the
      `wt6-webmanifest` plugin in vite.config.ts, not written here: both carry a
      colour, and a colour written in this file would be a redefinition of a
      design token. They are derived from `@weatherteam6/design/tokens`.

      iOS ignores the manifest's icons for Add to Home Screen and reads this
      link instead. No colour, so it stays here.
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />

    <!--
      Barlow Condensed (display) and Barlow (body) — the two families named by
      the design tokens. Weights match what tokens.ts actually uses.
      src/theme/fonts.ts carries a real fallback stack for when this fails.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
