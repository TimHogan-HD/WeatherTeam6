<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sun and shade at scale</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090c;--card:rgba(23,31,40,.72);--line:#2a3644;--t1:#f4f7fa;--mut:#bccad0;--t2:#d3e1e4;--brand:#1DC5D2;--bink:#6fe3ec;--raised:#1f2833}
*{box-sizing:border-box}
body{margin:0;background:#020304;color:var(--t1);font-family:Barlow,system-ui,sans-serif;display:flex;gap:28px;padding:24px;align-items:flex-start}
.col{width:480px;flex:none}
.tag{font:700 22px 'Barlow Condensed';color:var(--bink);margin:0 0 4px}
.tagsub{font:400 14px Barlow;color:var(--mut);margin:0 0 12px;min-height:60px}
.phone{width:480px;min-height:1000px;background:radial-gradient(120% 60% at 20% 0%,#0f2a33 0%,#07090c 55%),var(--bg);border-radius:28px;padding:16px;border:1px solid #1a222c;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 14px 14px;margin-bottom:12px}
h1{font:700 32px/1 'Barlow Condensed';margin:0}
.when{font:400 13px Barlow;color:var(--mut);margin:4px 0 0}
.illus{font:600 11px Barlow;color:#ffd27a;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.chips span{font:500 13px Barlow;padding:5px 11px;border-radius:999px;background:var(--raised);color:var(--t2);border:1px solid var(--line)}
.chips span.on{background:#0f3a40;border-color:var(--brand);color:var(--t1)}
.lab{font:600 11px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.fig{font:700 20px/22px 'Barlow Condensed';display:block}
small{font:400 12px Barlow;color:var(--mut)}
.sun{color:#ffd27a}.shd{color:#9fb3c8}
.big{font:700 112px/0.9 'Barlow Condensed';font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;align-items:center;margin-top:8px}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-left:1px solid var(--line);padding-left:14px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.side{background:var(--raised);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.side .n{font:700 44px/1 'Barlow Condensed';grid-row:span 3;font-variant-numeric:tabular-nums}
.k{font:600 12px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase}
.w{font:600 16px 'Barlow Condensed'}
.duo{display:grid;grid-template-columns:1fr 1fr;margin-top:10px}
.duo>div+div{border-left:1px solid var(--line);padding-left:16px}
.duo .big{font-size:92px;display:block;margin:2px 0}
.duo .k{display:block;font-size:13px}
.duo .w{display:block;font-size:18px}
.why{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;font:600 15px 'Barlow Condensed'}
.why span{margin-left:auto;font:400 12px Barlow;color:var(--mut)}
.sect{font:700 20px 'Barlow Condensed';margin:0 0 8px;display:flex;align-items:baseline}
.sect small{margin-left:auto}
.wl{display:grid;grid-template-columns:34px 18px 1fr auto;gap:2px 8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.wl:first-of-type{border-top:0}
.wl b{font:700 24px 'Barlow Condensed';font-variant-numeric:tabular-nums;text-align:right}
.wl .nm{font:600 16px 'Barlow Condensed'}
.wl .ar{font:400 12px Barlow;color:var(--mut);text-align:right}
.more{font:500 14px Barlow;color:var(--bink);margin-top:8px}
.legend{display:flex;gap:14px;font:400 12px Barlow;color:var(--mut);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.mini .cap{font:600 12px Barlow;color:var(--bink);margin-bottom:6px}
.mini .duo .big{font-size:60px}
.one{display:flex;align-items:center;gap:14px;margin-top:4px}
.one .big{font-size:72px}
.gap{font:700 60px/0.9 'Barlow Condensed';color:var(--mut)}
.tap{position:relative;cursor:pointer}
.chev{font:500 12px Barlow;color:var(--bink);display:flex;align-items:center;gap:3px;margin-top:4px}
.pin{font:600 10px Barlow;letter-spacing:.05em;text-transform:uppercase;color:#07090c;background:var(--bink);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.duo>div.tap{border-radius:14px;padding:6px 8px;margin:-6px 0}
.duo>div.tap.sel{background:rgba(29,197,210,.10);outline:1px solid var(--brand)}
.dim{position:relative}
.dim::after{content:'';position:absolute;inset:0;background:rgba(2,3,4,.62);border-radius:28px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:2;background:#121a22;border-top:1px solid var(--line);border-radius:22px 22px 28px 28px;padding:10px 16px 18px}
.grab{width:40px;height:4px;border-radius:2px;background:#3a4756;margin:0 auto 10px}
.sh{font:700 22px 'Barlow Condensed';margin:0}
.ss{font:400 13px Barlow;color:var(--mut);margin:2px 0 10px}
.opt{display:grid;grid-template-columns:22px 34px 1fr auto;gap:8px;align-items:center;padding:9px 6px;border-top:1px solid var(--line)}
.opt b{font:700 22px 'Barlow Condensed';text-align:right;font-variant-numeric:tabular-nums}
.opt .nm{font:600 16px 'Barlow Condensed'}
.opt .r{font:400 12px Barlow;color:var(--mut)}
.opt.on{background:rgba(29,197,210,.10);border-radius:10px}
.radio{width:16px;height:16px;border-radius:50%;border:2px solid #56677a}
.on .radio{border-color:var(--brand);box-shadow:inset 0 0 0 3px #121a22;background:var(--brand)}
.grp{font:600 11px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:10px 0 2px 6px}
.phone{position:relative}
.duo small{display:block}
.side.tap{grid-template-columns:auto 1fr;padding:12px;border:1px solid transparent}
.side.tap.sel{border-color:var(--brand);background:rgba(29,197,210,.10)}
.side .n{font-size:48px}
.side small{display:block}
.side .chev{grid-column:2;margin-top:3px}
.sides{margin-top:14px}
.chart-h{font:400 12px Barlow;color:var(--mut)}
.col{width:440px}.phone{width:440px}
.big{font-size:112px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:#3a4756}
.dots i.on{background:var(--bink);width:18px;border-radius:4px}
.pg{font:600 12px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.peek{position:absolute;right:-34px;top:120px;width:60px;height:150px;border-radius:16px;background:var(--raised);opacity:.55;border:1px solid var(--line);display:flex;align-items:center;padding-left:8px;font:700 34px 'Barlow Condensed';color:#fc8181}
.hcard{position:relative;overflow:hidden}
.ssline{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;background:var(--raised);border-radius:14px;font:600 17px 'Barlow Condensed'}
.ssline b{font:700 24px 'Barlow Condensed';font-variant-numeric:tabular-nums}
.ssline .sep{color:var(--mut);font-weight:400}
.ssline .chev{margin:0 0 0 auto}
.quiet{margin-top:12px;font:400 13px Barlow;color:var(--mut);display:flex;gap:8px;align-items:center}
.quiet b{color:var(--t2);font-weight:500}
.hint{font:400 11px Barlow;color:var(--mut);text-align:center;margin-top:4px}
</style></head><body>
<script>
const stops=[[36,'#fc8181'],[44,'#f6ad55'],[56,'#f6ad55'],[64,'#b8f542'],[100,'#c8f76a']];
function col(s){if(s<=36)return stops[0][1];for(let i=1;i<stops.length;i++){if(s<=stops[i][0]){const [a,ca]=stops[i-1],[b,cb]=stops[i];const t=(s-a)/(b-a);const h=x=>parseInt(x,16);const m=k=>Math.round(h(ca.slice(k,k+2))*(1-t)+h(cb.slice(k,k+2))*t).toString(16).padStart(2,'0');return '#'+m(1)+m(3)+m(5)}}return stops.at(-1)[1]}
const lbl=h=>(h%12||12)+(h<12?' AM':' PM');
// Red Wing 2026-10-19 from 1 PM: real Crag A and Wall A output.
const H=[13,14,15,16,17,18], CRAG=[100,100,100,100,100,100], SUN=[20,20,22,25,32,49], SHADE=[100,89,83,75,74,84];
function chart(series,{w=400,h=140}={}){const n=H.length,x=i=>16+i*(w-32)/(n-1),y=s=>h-20-(s/100)*(h-36);
 let g=`<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">`;
 [0,50,100].forEach(v=>g+=`<line x1="10" x2="${w-6}" y1="${y(v)}" y2="${y(v)}" stroke="#2a3644" stroke-dasharray="${v?'2 4':''}"/>`);
 series.forEach(s=>{g+=`<path d="${s.v.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="${s.w??3}" stroke-linecap="round" stroke-linejoin="round" ${s.dash?'stroke-dasharray="6 5"':''} ${s.op?`opacity="${s.op}"`:''}/>`;
  g+=`<circle cx="${x(0)}" cy="${y(s.v[0])}" r="5" fill="${col(s.v[0])}" stroke="#07090c" stroke-width="2"/>`});
 H.forEach((hh,i)=>g+=`<text x="${x(i)}" y="${h-3}" fill="#bccad0" font-family="Barlow" font-size="11" text-anchor="middle">${lbl(hh)}</text>`);
 return g+'</svg>'}
const legend=items=>`<div class="legend">${items.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
const cells=(air='60°F',good='8 AM–6 PM')=>`<div class="cells"><div><span class="lab">Dryness</span><b class="fig">Dry</b><small>9 days since rain</small></div><div><span class="lab">Air</span><b class="fig">${air}</b><small>high 67° · low 40°</small></div><div><span class="lab">Rock</span><b class="fig">Limestone</b></div><div><span class="lab">Good hours</span><b class="fig">${good}</b></div></div>`;
const hdr=(t='Score at 1 PM')=>`<h1>Red Wing (Barn Bluff)</h1><p class="when">${t}</p>`;
const why=`<div class="why">Score breakdown<span>1 cause ›</span></div>`;
const today=(lines,items,sub='')=>`<div class="card"><p class="sect">Today<small>${sub}</small></p>${chart(lines)}${legend(items)}</div>`;

// 3a: swipe hero, page 1 (crag)
const P3a=`<div class="card hcard">${hdr()}<p class="pg" style="color:var(--mut)">Crag</p>
 <div class="hero" style="margin-top:2px"><span class="big" style="color:${col(100)}">100</span>${cells()}</div>
 <div class="peek">20</div>
 <div class="dots"><i class="on"></i><i></i><i></i></div><div class="hint">Swipe for sun and shade walls</div>${why}</div>
 ${today([{v:CRAG,c:'#c8f76a'}],[['#c8f76a','Crag']])}`;

// 3b: swipe hero, page 2 (sun)
const P3b=`<div class="card hcard">${hdr()}<p class="pg sun">☀ Best in sun</p>
 <div class="hero" style="margin-top:2px"><span class="big" style="color:${col(20)}">20</span><div class="cells" style="grid-template-columns:1fr"><div><span class="lab">Wall</span><b class="fig">Winter Wall</b><small>faces SSE · 2 of 6 walls in sun</small></div><div><span class="lab">Sun on it</span><b class="fig">7:40 AM–5:55 PM</b></div><div><span class="lab">Pick a wall ▾</span></div></div></div>
 <div class="dots"><i></i><i class="on"></i><i></i></div><div class="hint">Crag · ☀ Sun · ◐ Shade</div>${why}</div>
 ${today([{v:SUN,c:'#ffd27a'},{v:CRAG,c:'#c8f76a',w:2,op:.35}],[['#ffd27a','Winter Wall'],['#c8f76a','Crag (faint)']])}`;

// 4: one line under the hero
const P4=`<div class="card">${hdr()}
 <div class="hero"><span class="big" style="color:${col(100)}">100</span>${cells()}</div>
 <div class="ssline"><span class="sun">☀</span><span>Winter Wall</span><b style="color:${col(20)}">20</b><span class="sep">·</span><span class="shd">◐</span><span>Large Roof</span><b style="color:${col(100)}">100</b><span class="chev">▾</span></div>
 ${why}</div>
 ${today([{v:CRAG,c:'#c8f76a',w:2,op:.5},{v:SUN,c:'#ffd27a'},{v:SHADE,c:'#9fb3c8',dash:1}],[['#c8f76a','Crag'],['#ffd27a','Winter Wall'],['#9fb3c8','Large Roof']],'appears with the line')}`;

// Rule 1: quiet day, illustrative overcast numbers
const Q=`<div class="mini"><div class="cap">Rule 1 · quiet day (illustrative overcast: sun wall 90, shade wall 92)</div>
 ${hdr()}<div class="hero"><span class="big" style="font-size:88px;color:${col(92)}">92</span>${cells('58°F','9 AM–6 PM')}</div>
 <div class="quiet"><span>◐☀</span><b>Sun and shade walls alike today</b></div></div>
 <div class="mini"><div class="cap">Rule 1 in idea 3</div><small>No dots, no swipe: the hero is one page. The pages come back the first hour the walls differ by 10+ points.</small></div>
 <div class="mini"><div class="cap">Rule 1 in idea 4</div><small>The line is replaced by the grey "alike today" line above, so the hero never jumps in height.</small></div>
 <div class="mini"><div class="cap">Open question</div><small>Which hour decides? The hero's hour (1 PM here). If the gap opens at 3 PM, the line appears when the hero reaches 3 PM; the Today chart already shows the wall lines splitting.</small></div>`;

document.body.innerHTML=[
 ['3 · Swipe hero, page 1','The crag score is page 1. A sliver of the next page and the dots say there is more.',P3a],
 ['3 · Swipe hero, page 2','Best in sun is a full hero: the wall, its sun hours, and "Pick a wall". The chart follows the page.',P3b],
 ['4 · One line under the hero','Both walls in one tappable line. Tap opens the wall sheet. The chart gains the two wall lines.',P4],
 ['Rule 1 · only when it matters','When the walls score within 10 points, both ideas fall back to today\'s Overview plus one quiet line.',Q],
].map(([t,s,h])=>`<div class="col"><p class="tag">${t}</p><p class="tagsub">${s}</p><div class="phone">${h}</div></div>`).join('');
</script>
</body></html>
